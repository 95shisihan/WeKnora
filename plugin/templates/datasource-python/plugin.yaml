apiVersion: plugins.weknora.io/v1alpha1
kind: Plugin
metadata:
  id: dev.example.local-directory
  name: Example Local Directory
  version: 0.1.0
  description: Minimal standalone Python datasource plugin.
spec:
  enabled: true
  extensionPoints:
    - type: datasource
      id: example_local_directory
      protocolVersion: v1
      name: Example Local Directory
      authType: none
      capabilities: [incremental, deletion_sync]
  compatibility:
    weknora: ">=0.7.0 <0.8.0"
    pluginAPI: v1
  runtime:
    type: oci
    image: example/weknora-local-directory:0.1.0
    startupTimeout: 20s
    mounts:
      - source: sample-data
        target: /data
        readOnly: true
    resources:
      memoryBytes: 134217728
      cpuLimit: 0.5
      pidsLimit: 64
  configSchema:
    type: object
    required: [root]
    properties:
      root:
        type: string
        title: Directory in sandbox
        default: /data
  permissions:
    network:
      outbound: false
    filesystem:
      read: [sample-data]
      write: []
