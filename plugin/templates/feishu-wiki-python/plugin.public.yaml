apiVersion: plugins.weknora.io/v1alpha1
kind: Plugin
metadata:
  id: dev.example.feishu-public
  name: 飞书公开链接导入
  version: 0.2.0
  description: 无需应用凭据，导入匿名可读的单篇飞书页面文字；不自动遍历知识库。
spec:
  enabled: true
  extensionPoints:
    - type: datasource
      id: feishu_public_plugin
      protocolVersion: v1
      name: 飞书公开链接（无需应用凭据）
      authType: none
      capabilities: [incremental]
  compatibility:
    weknora: ">=0.7.0 <0.8.0"
    pluginAPI: v1
  runtime:
    type: grpc
    command: [bin/weknora-feishu-public.exe]
    address: stdio://
    startupTimeout: 60s
  configSchema:
    type: object
    required: [public_urls]
    properties:
      public_urls:
        type: string
        title: 公开飞书页面链接
        description: 填写 1 至 20 个链接，以逗号分隔。仅导入所填页面，不包含子页面；需无需登录即可阅读。
  permissions:
    network:
      outbound: false
      http:
        rules:
          - hosts: [docs.feishu.cn, www.feishu.cn, xiaobot123.feishu.cn, accounts.feishu.cn, login.feishu.cn]
            methods: [GET]
        maxRedirects: 5
        timeoutSeconds: 20
        maxRequestBytes: 1024
        maxResponseBytes: 2097152
    filesystem:
      read: []
      write: []
