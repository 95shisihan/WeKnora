syntax = "proto3";

package weknora.plugin.v1;

option go_package = "github.com/Tencent/WeKnora/plugin/proto;pluginproto";

service WebSearchPlugin {
  rpc GetInfo(WebSearchInfoRequest) returns (WebSearchInfoResponse);
  rpc Search(WebSearchRequest) returns (WebSearchResponse);
}

message WebSearchInfoRequest {}
message WebSearchInfoResponse {
  string id = 1;
  string version = 2;
  string protocol_version = 3;
  string provider_type = 4;
}

message WebSearchRequest {
  bytes parameters_json = 1;
  string query = 2;
  int32 max_results = 3;
  bool include_date = 4;
}

message WebSearchResult {
  string title = 1;
  string url = 2;
  string snippet = 3;
  string content = 4;
  string source = 5;
  int64 published_at_unix_milli = 6;
  bool has_published_at = 7;
}

message WebSearchResponse { repeated WebSearchResult results = 1; }
