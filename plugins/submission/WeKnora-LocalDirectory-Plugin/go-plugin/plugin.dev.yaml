apiVersion: plugins.weknora.io/v1alpha1
kind: Plugin
metadata:
  id: io.weknora.local-directory
  name: Local Directory
  version: 0.1.0
  description: Local process development mode for the directory plugin.
spec:
  enabled: true
  extensionPoints:
    - type: datasource
      id: local_directory
      protocolVersion: v1
      name: Local Directory
      priority: 20
      authType: none
      capabilities: [incremental, deletion_sync, hierarchical]
  compatibility:
    weknora: ">=0.7.0 <0.8.0"
    pluginAPI: v1
  runtime:
    type: grpc
    address: 127.0.0.1:50101
    command: [bin/weknora-plugin-local-directory]
    startupTimeout: 10s
  configSchema:
    type: object
    required: [root]
    properties:
      root:
        type: string
        title: Directory
        description: Absolute host path used only during local development.
  permissions:
    network:
      outbound: true
    filesystem:
      read: ["config:settings.root"]
      write: []
