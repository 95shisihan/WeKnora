name: Plugin contract
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go-plugin/go.sum
      - name: Test and build upload ZIP
        shell: pwsh
        working-directory: go-plugin
        run: ./build.ps1
