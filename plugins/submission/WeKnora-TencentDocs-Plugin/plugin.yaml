apiVersion: plugins.weknora.io/v1alpha1
kind: Plugin
metadata:
  id: dev.example.tencent-docs-public
  name: 腾讯文档公开链接导入
  version: 0.2.0
  description: 导入匿名可读的腾讯普通文档正文，支持资源选择和内容指纹增量同步；需批准受控 GET 权限。
spec:
  enabled: false
  extensionPoints:
    - type: datasource
      id: tencent_docs_public_probe
      protocolVersion: v1
      name: 腾讯文档公开链接导入
      authType: none
      capabilities: [incremental]
  compatibility:
    weknora: ">=0.7.0 <0.8.0"
    pluginAPI: v1
  runtime:
    type: grpc
    address: stdio://
    command: [bin/weknora-tencent-docs-public.exe]
    startupTimeout: 30s
  configSchema:
    type: object
    required: [url]
    properties:
      url:
        type: string
        title: 腾讯文档公开链接
        description: 填写 1 至 20 个 https://docs.qq.com/doc/文档ID 链接，用逗号分隔；需允许任何人查看。仅普通文字文档，不支持表格、图片 OCR 或分块长文档。
  permissions:
    network:
      outbound: false
      http:
        rules:
          - hosts: [docs.qq.com]
            methods: [GET]
        maxRedirects: 3
        timeoutSeconds: 20
        maxRequestBytes: 1024
        maxResponseBytes: 2097152
    filesystem:
      read: []
      write: []
