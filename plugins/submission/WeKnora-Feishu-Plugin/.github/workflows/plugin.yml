name: Feishu plugin contract
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. datasource.proto
      - run: python -m unittest -v
      - run: docker build -t weknora-feishu-plugin:test .
